<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- てにろぐ君: テニスボールのキャラクターがラケットを持っている -->
  <!-- ラケット(ボールの後ろ、右上に向けて持つ) -->
  <g transform="rotate(35 96 44)">
    <rect x="92" y="62" width="8" height="34" rx="4" fill="#8a5a2b"/>
    <rect x="92" y="80" width="8" height="16" rx="4" fill="#3b4a6b"/>
    <ellipse cx="96" cy="38" rx="20" ry="25" fill="#ffffff" stroke="#2a78d6" stroke-width="5"/>
    <g stroke="#9cc3ef" stroke-width="1.6">
      <line x1="86" y1="16" x2="86" y2="60"/><line x1="96" y1="13" x2="96" y2="63"/>
      <line x1="106" y1="16" x2="106" y2="60"/>
      <line x1="77" y1="28" x2="115" y2="28"/><line x1="76" y1="38" x2="116" y2="38"/>
      <line x1="77" y1="48" x2="115" y2="48"/>
    </g>
  </g>
  <!-- ボール本体 -->
  <circle cx="54" cy="72" r="44" fill="#d7ec3a" stroke="#9fb51c" stroke-width="3"/>
  <!-- ボールの縫い目(白い曲線) -->
  <path d="M14 56 C 34 64, 34 92, 22 106" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M94 50 C 76 58, 74 86, 88 102" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- 顔 -->
  <ellipse cx="42" cy="68" rx="5" ry="6.5" fill="#2b2b2b"/>
  <ellipse cx="66" cy="68" rx="5" ry="6.5" fill="#2b2b2b"/>
  <circle cx="43.8" cy="65.6" r="1.8" fill="#ffffff"/>
  <circle cx="67.8" cy="65.6" r="1.8" fill="#ffffff"/>
  <ellipse cx="32" cy="80" rx="6" ry="3.5" fill="#f4a3a3" opacity="0.8"/>
  <ellipse cx="76" cy="80" rx="6" ry="3.5" fill="#f4a3a3" opacity="0.8"/>
  <path d="M46 80 Q 54 89, 62 80" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
</svg>
